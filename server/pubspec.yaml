name: ibuild_server
description: >
  Lightweight Dart backend for the iBuild B2C client. Stands in for the
  production NestJS + PostgreSQL + Redis API described in IBUILD_APP_PLAN.md
  (§6, §8) so the app can run fully end-to-end against a real server in this
  dev environment. Same REST contract shape (envelope, resource paths,
  WebSocket events) — swap the implementation, not the client, when the real
  backend is built.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  uuid: ^4.5.1
  postgres: ^3.5.12
  # Pure-Dart photo analysis for the AI readiness engine (decode, pHash,
  # EXIF date/GPS) — no native toolchain on the VDS.
  image: ^4.9.1
  exif: ^3.3.0
  # sha256 for the AI quota key (never store a raw client IP).
  crypto: ^3.0.7

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.0
