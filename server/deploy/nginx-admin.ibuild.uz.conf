# B2B admin app — static Flutter web build.
# Install:
#   sudo cp nginx-admin.ibuild.uz.conf /etc/nginx/sites-available/admin.ibuild.uz
#   sudo ln -sf /etc/nginx/sites-available/admin.ibuild.uz /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d admin.ibuild.uz
#   sudo nginx -t && sudo systemctl reload nginx
#
# Build output goes to /var/www/ibuild/admin (see HOSTING_AIRNET.md).

server {
  listen 443 ssl http2;
  server_name admin.ibuild.uz;

  ssl_certificate     /etc/letsencrypt/live/admin.ibuild.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.ibuild.uz/privkey.pem;

  root /var/www/ibuild/admin;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Flutter never hashes main.dart.js / flutter.js / flutter_bootstrap.js —
  # filenames stay identical across deploys. Caching them "immutable" (as
  # a previous version of this file did) meant browsers kept a 7-day-old
  # bundle and never even asked the server again until the cache was
  # cleared by hand. Always revalidate JS/CSS/the service worker instead;
  # only truly static assets (fonts, images) get a long cache.
  location ~* \.(js|css)$ {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(woff2?|png|jpg|jpeg|gif|ico|svg|webp)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}

server {
  listen 80;
  server_name admin.ibuild.uz;
  return 301 https://$host$request_uri;
}
