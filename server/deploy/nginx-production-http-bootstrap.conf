# Temporary HTTP-only vhosts for Let's Encrypt webroot issuance.
# Replaced by nginx-*.ibuild.uz.conf after certbot succeeds.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name ibuild.uz www.ibuild.uz;

  root /var/www/ibuild/www;
  index index.html;
  client_max_body_size 25m;
  server_tokens off;

  location /.well-known/acme-challenge/ {
    root /var/www/ibuild/www;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name app.ibuild.uz;

  root /var/www/ibuild/app;
  index index.html;
  client_max_body_size 25m;
  server_tokens off;

  location /.well-known/acme-challenge/ {
    root /var/www/ibuild/app;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name admin.ibuild.uz;

  root /var/www/ibuild/admin;
  index index.html;
  client_max_body_size 25m;
  server_tokens off;

  location /.well-known/acme-challenge/ {
    root /var/www/ibuild/admin;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name api.ibuild.uz;

  client_max_body_size 25m;
  server_tokens off;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 3600s;
  }
}
