server {
  listen 443 ssl http2;
  server_name ibuild.uz www.ibuild.uz;

  ssl_certificate     /etc/letsencrypt/live/ibuild.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ibuild.uz/privkey.pem;

  client_max_body_size 25m;
  server_tokens off;

  # Landing is not ready for public search indexing yet — robots.txt plus
  # this header (belt and suspenders: header wins even if a page's own
  # <meta name="robots"> is missing or a crawler ignores robots.txt).
  add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

  root /var/www/ibuild/www;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg|webp|ttf)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}

server {
  listen 80;
  server_name ibuild.uz www.ibuild.uz;
  return 301 https://$host$request_uri;
}
