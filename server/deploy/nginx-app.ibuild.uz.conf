# B2C buyer app — static Flutter web build.
# Install:
#   sudo cp nginx-app.ibuild.uz.conf /etc/nginx/sites-available/app.ibuild.uz
#   sudo ln -sf /etc/nginx/sites-available/app.ibuild.uz /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d app.ibuild.uz
#   sudo nginx -t && sudo systemctl reload nginx
#
# Build output goes to /var/www/ibuild/app (see HOSTING_AHOST.md).

server {
  listen 443 ssl http2;
  server_name app.ibuild.uz;

  ssl_certificate     /etc/letsencrypt/live/app.ibuild.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.ibuild.uz/privkey.pem;

  root /var/www/ibuild/app;
  index index.html;

  # Flutter web / SPA — unknown paths fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed assets aggressively; never cache index.html.
  location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg|webp)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}

server {
  listen 80;
  server_name app.ibuild.uz;
  return 301 https://$host$request_uri;
}
