# API reverse proxy — Dart API on 127.0.0.1:4000
# Install:
#   sudo cp nginx-api.ibuild.uz.conf /etc/nginx/sites-available/api.ibuild.uz
#   sudo ln -sf /etc/nginx/sites-available/api.ibuild.uz /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.ibuild.uz
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 443 ssl http2;
  server_name api.ibuild.uz;

  ssl_certificate     /etc/letsencrypt/live/api.ibuild.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.ibuild.uz/privkey.pem;

  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 3600s;
  }
}

server {
  listen 80;
  server_name api.ibuild.uz;
  return 301 https://$host$request_uri;
}
