# IP staging — HTTP until api/app/admin.ibuild.uz DNS is ready.
#
# Install (setup-docker-server.sh does this automatically):
#   sudo cp nginx-staging-ip.conf /etc/nginx/sites-available/ibuild-staging
#   sudo ln -sf /etc/nginx/sites-available/ibuild-staging /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Layout on one public IP:
#   http://IP/           → B2C  (/var/www/ibuild/app)
#   http://IP:8080/      → B2B  (/var/www/ibuild/admin)
#   http://IP/v1/...     → API  (127.0.0.1:4000, Docker host network)

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# --- B2C buyer app (port 80) + API under /v1 ---------------------------------

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  client_max_body_size 25m;
  server_tokens off;

  root /var/www/ibuild/app;
  index index.html;

  # Dart API — ^~ skips regex static-file locations below (e.g. .png under /v1/).
  location ^~ /v1/ {
    proxy_pass http://127.0.0.1:4000/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # OVERWRITE — see nginx-api.ibuild.uz.conf for why not $proxy_add_x_forwarded_for.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg|webp)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}

# --- B2B admin app (port 8080) -----------------------------------------------

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  client_max_body_size 25m;
  server_tokens off;

  root /var/www/ibuild/admin;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg|webp)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
