name: Deploy (staging VDS)

# Push to main → rebuild and ship API (Docker) + B2B/B2C static web apps.
# Requires repository secrets: AIRNET_HOST, AIRNET_USER, AIRNET_SSH_KEY.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          AIRNET_HOST: ${{ secrets.AIRNET_HOST }}
        run: |
          if [ -n "$AIRNET_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  # --- API -------------------------------------------------------------------
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: server
      - run: |
          dart analyze
          dart test
        working-directory: server

  api-build:
    runs-on: ubuntu-latest
    needs: api-test
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          owner_repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_repo}/api:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${owner_repo}/api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api-deploy:
    runs-on: ubuntu-latest
    needs: [api-build, check-secrets]
    if: needs.check-secrets.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Sync deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AIRNET_HOST }}
          username: ${{ secrets.AIRNET_USER }}
          key: ${{ secrets.AIRNET_SSH_KEY }}
          source: 'server/deploy/docker-compose.yml,server/deploy/first-deploy.sh,server/deploy/healthcheck-docker.sh,server/deploy/sync-residences-images.sh,server/deploy/nginx-staging-ip.conf,server/deploy/nginx-ibuild.uz.conf,server/deploy/nginx-app.ibuild.uz.conf,server/deploy/nginx-api.ibuild.uz.conf,server/deploy/nginx-admin.ibuild.uz.conf,server/scripts/apply-production-nginx.sh'
          target: '/opt/ibuild/deploy/'
          strip_components: 2

      - name: Upload residence images
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AIRNET_HOST }}
          username: ${{ secrets.AIRNET_USER }}
          key: ${{ secrets.AIRNET_SSH_KEY }}
          source: 'server/residences-images/*'
          target: '/tmp/residences-images-staging/'
          strip_components: 2

      - name: Pull and restart API
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEW_IMAGE: ${{ needs.api-build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.AIRNET_HOST }}
          username: ${{ secrets.AIRNET_USER }}
          key: ${{ secrets.AIRNET_SSH_KEY }}
          envs: NEW_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            chmod +x /opt/ibuild/deploy/*.sh 2>/dev/null || true
            cd /opt/ibuild/deploy
            if [ ! -f /opt/ibuild/server/.env ]; then
              echo "ERROR: /opt/ibuild/server/.env missing on the VDS."
              exit 1
            fi
            PREV="$(docker inspect --format '{{.Config.Image}}' ibuild-api 2>/dev/null || true)"
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            echo "IBUILD_IMAGE=${NEW_IMAGE}" > .env
            bash /opt/ibuild/deploy/sync-residences-images.sh /tmp/residences-images-staging
            docker compose pull
            docker compose up -d --remove-orphans
            ok=0
            for _ in $(seq 1 90); do
              if curl -fsS http://127.0.0.1:4000/v1/health >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Health check failed — rolling back"
              docker compose logs --tail=200 api || true
              if [ -n "$PREV" ]; then
                echo "IBUILD_IMAGE=${PREV}" > .env
                docker compose up -d
              fi
              exit 1
            fi
            docker image prune -af --filter 'until=168h'

  # --- Flutter web (B2B + B2C) -----------------------------------------------
  web-deploy:
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build defines for production domains
        run: |
          # api/app/admin.ibuild.uz are live behind TLS. Baking the raw IP
          # (http://<ip>/v1) here used to overwrite the same web roots these
          # domains serve from — every push replaced the working build with
          # one that called plain HTTP from an HTTPS page, which browsers
          # block as mixed content. That is why OTP/login kept silently
          # failing after unrelated deploys. Always target the real domains.
          cat > b2b/dart_defines.staging.json <<JSON
          {"API_BASE_URL":"https://api.ibuild.uz/v1","WS_URL":"wss://api.ibuild.uz/v1/ws"}
          JSON
          cat > b2c/dart_defines.staging.json <<JSON
          {"USE_MOCK_DATA":"false","API_BASE_URL":"https://api.ibuild.uz/v1","WS_URL":"wss://api.ibuild.uz/v1/ws","BUSINESS_URL":"https://admin.ibuild.uz"}
          JSON

      - name: Build B2B admin
        working-directory: b2b
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=none \
            --dart-define-from-file=dart_defines.staging.json

      - name: Build B2C app
        working-directory: b2c
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=none \
            --dart-define-from-file=dart_defines.staging.json

      - name: Pack web builds
        run: |
          tar czf b2c-web.tgz -C b2c/build web
          tar czf b2b-web.tgz -C b2b/build web

      - name: Upload archives
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AIRNET_HOST }}
          username: ${{ secrets.AIRNET_USER }}
          key: ${{ secrets.AIRNET_SSH_KEY }}
          source: 'b2c-web.tgz,b2b-web.tgz'
          target: '/tmp'

      - name: Upload landing site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AIRNET_HOST }}
          username: ${{ secrets.AIRNET_USER }}
          key: ${{ secrets.AIRNET_SSH_KEY }}
          source: 'www/*'
          target: '/tmp/ibuild-www-src/'
          strip_components: 1

      - name: Install static files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AIRNET_HOST }}
          username: ${{ secrets.AIRNET_USER }}
          key: ${{ secrets.AIRNET_SSH_KEY }}
          script: |
            set -euo pipefail

            install_web() {
              src="$1"
              dest="$2"
              docker run --rm -v "${src}:/src:ro" -v "${dest}:/dest" alpine:3.20 \
                sh -c 'mkdir -p /dest && rm -rf /dest/* && cp -a /src/. /dest/ && chown -R 33:33 /dest && find /dest -type d -exec chmod 755 {} + && find /dest -type f -exec chmod 644 {} +'
            }

            rm -rf /tmp/b2c-web /tmp/b2b-web
            mkdir -p /tmp/b2c-web /tmp/b2b-web
            tar xzf /tmp/b2c-web.tgz -C /tmp/b2c-web
            tar xzf /tmp/b2b-web.tgz -C /tmp/b2b-web
            install_web /tmp/b2c-web/web /var/www/ibuild/app
            install_web /tmp/b2b-web/web /var/www/ibuild/admin
            install_web /tmp/ibuild-www-src /var/www/ibuild/www
            docker run --rm -v /var/www/ibuild/admin:/dest alpine:3.20 rm -f /dest/flutter_service_worker.js 2>/dev/null || true

            # Production already has TLS-terminated vhosts for
            # api/app/admin/www.ibuild.uz (see server/deploy/nginx-*.ibuild.uz.conf,
            # applied once via apply-production-nginx.sh). Do not install or
            # enable the IP-based staging vhost (nginx-staging-ip.conf) here —
            # it is for a bare-IP bring-up before DNS/TLS exist, not for
            # every deploy on top of a live production domain setup.

            docker run --rm --privileged --pid=host -v /run:/run --user 0:0 alpine:3.20 \
              sh -c 'kill -HUP "$(cat /run/nginx.pid)"'

            if [ -x /opt/ibuild/deploy/sync-residences-images.sh ]; then
              bash /opt/ibuild/deploy/sync-residences-images.sh /opt/ibuild/server/residences-images || true
            fi

            rm -rf /tmp/b2c-web /tmp/b2b-web /tmp/b2c-web.tgz /tmp/b2b-web.tgz
