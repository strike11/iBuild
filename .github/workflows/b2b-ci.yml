name: b2b-ci

on:
  push:
    paths:
      - 'b2b/**'
      # b2b depends on ibuild_core via a path dependency, so a change there
      # can break this app without touching b2b/ at all.
      - 'packages/ibuild_core/**'
      - '.github/workflows/b2b-ci.yml'
  pull_request:
    paths:
      - 'b2b/**'
      - 'packages/ibuild_core/**'
      - '.github/workflows/b2b-ci.yml'

jobs:
  analyze-test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: b2b
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Both defines must be passed together: building with only API_BASE_URL
      # left the socket pointing at the compiled-in default host.
      - run: |
          flutter build web --release \
            --dart-define=API_BASE_URL=https://api.ibuild.uz/v1 \
            --dart-define=WS_URL=wss://api.ibuild.uz/v1/ws
