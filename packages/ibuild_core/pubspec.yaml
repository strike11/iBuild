name: ibuild_core
description: >-
  Shared foundation for the iBuild apps — semantic theme tokens, common
  widgets, networking helpers, and domain models. Consumed by the B2B admin
  app (and, in a later pass, the B2C app) to kill cross-app duplication.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
