<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="iBuild — platform and project administration.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="iBuild Admin">
  <meta name="theme-color" content="#002147">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <script>
    (function () {
      var mode = null;
      try { mode = localStorage.getItem('flutter.ibuild_b2b.theme.mode'); } catch (e) {}
      var root = document.documentElement;
      if (mode === 'dark' || mode === 'light') {
        root.setAttribute('data-ibuild-theme', mode);
      }
      var meta = document.querySelector('meta[name="theme-color"]');
      if (!meta) return;
      if (mode === 'dark') meta.setAttribute('content', '#0A1F35');
      else if (mode === 'light') meta.setAttribute('content', '#002147');
    })();
  </script>

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/png" href="favicon-dark.png" media="(prefers-color-scheme: dark)"/>

  <title>iBuild Admin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #E4E7EB;
    }

    #ibuild-boot {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #E4E7EB;
      transition: opacity 220ms ease;
    }

    #ibuild-boot.done {
      opacity: 0;
      pointer-events: none;
    }

    .ibuild-mark {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 33, 71, 0.12);
      animation: ibuild-pulse 1.1s ease-in-out infinite alternate;
    }

    .ibuild-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .ibuild-bar {
      width: 120px;
      height: 3px;
      border-radius: 999px;
      background: #C8CCD2;
      overflow: hidden;
    }

    .ibuild-bar > i {
      display: block;
      height: 100%;
      width: 42%;
      border-radius: 999px;
      background: #002147;
      animation: ibuild-slide 1.05s ease-in-out infinite;
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-ibuild-theme="light"]),
      html:not([data-ibuild-theme="light"]) body {
        background: #0A1F35;
      }
      html:not([data-ibuild-theme="light"]) #ibuild-boot { background: #0A1F35; }
      html:not([data-ibuild-theme="light"]) .ibuild-bar { background: #1E3348; }
      html:not([data-ibuild-theme="light"]) .ibuild-bar > i { background: #C8CCD2; }
      html:not([data-ibuild-theme="light"]) .ibuild-mark img.logo-light { display: none; }
      html:not([data-ibuild-theme="light"]) .ibuild-mark img.logo-dark { display: block; }
    }

    html[data-ibuild-theme="dark"],
    html[data-ibuild-theme="dark"] body {
      background: #0A1F35;
    }
    html[data-ibuild-theme="dark"] #ibuild-boot { background: #0A1F35; }
    html[data-ibuild-theme="dark"] .ibuild-bar { background: #1E3348; }
    html[data-ibuild-theme="dark"] .ibuild-bar > i { background: #C8CCD2; }
    html[data-ibuild-theme="dark"] .ibuild-mark img.logo-light { display: none; }
    html[data-ibuild-theme="dark"] .ibuild-mark img.logo-dark { display: block; }

    html[data-ibuild-theme="light"],
    html[data-ibuild-theme="light"] body {
      background: #E4E7EB;
    }
    html[data-ibuild-theme="light"] #ibuild-boot { background: #E4E7EB; }
    html[data-ibuild-theme="light"] .ibuild-bar { background: #C8CCD2; }
    html[data-ibuild-theme="light"] .ibuild-bar > i { background: #002147; }
    html[data-ibuild-theme="light"] .ibuild-mark img.logo-light { display: block; }
    html[data-ibuild-theme="light"] .ibuild-mark img.logo-dark { display: none; }

    .ibuild-mark img.logo-dark { display: none; }

    @keyframes ibuild-pulse {
      from { transform: scale(0.94); opacity: 0.82; }
      to   { transform: scale(1);    opacity: 1; }
    }

    @keyframes ibuild-slide {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(280%); }
    }
  </style>
</head>
<body>
  <div id="ibuild-boot" aria-busy="true" aria-label="Loading iBuild Admin">
    <div class="ibuild-mark" aria-hidden="true">
      <img class="logo-light" src="icons/Icon-192.png" alt="" width="72" height="72">
      <img class="logo-dark" src="icons/Icon-dark-192.png" alt="" width="72" height="72">
    </div>
    <div class="ibuild-bar" aria-hidden="true"><i></i></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('ibuild-boot');
      if (!el) return;
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 260);
    });
  </script>
</body>
</html>
