<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="iBuild — find your dream home.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="iBuild">
  <meta name="theme-color" content="#F6F3EA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>iBuild</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #F6F3EA;
    }

    /* Covers Flutter's default blue bootstrap spinner until first frame. */
    #ibuild-boot {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #F6F3EA;
      transition: opacity 220ms ease;
    }

    #ibuild-boot.done {
      opacity: 0;
      pointer-events: none;
    }

    .ibuild-mark {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #1B1C1A;
      display: grid;
      place-items: center;
      animation: ibuild-pulse 1.1s ease-in-out infinite alternate;
    }

    .ibuild-mark svg {
      width: 30px;
      height: 30px;
      fill: #0F5C56;
    }

    .ibuild-bar {
      width: 120px;
      height: 3px;
      border-radius: 999px;
      background: #EFEADD;
      overflow: hidden;
    }

    .ibuild-bar > i {
      display: block;
      height: 100%;
      width: 42%;
      border-radius: 999px;
      background: #0F5C56;
      animation: ibuild-slide 1.05s ease-in-out infinite;
    }

    @keyframes ibuild-pulse {
      from { transform: scale(0.94); opacity: 0.82; }
      to   { transform: scale(1);    opacity: 1; }
    }

    @keyframes ibuild-slide {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(280%); }
    }
  </style>
</head>
<body>
  <div id="ibuild-boot" aria-busy="true" aria-label="Loading iBuild">
    <div class="ibuild-mark" aria-hidden="true">
      <!-- Building glyph matching BrandMark -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 11V3H7v4H3v14h8v-4h2v4h8V11h-4zM7 19H5v-2h2v2zm0-4H5v-2h2v2zm0-4H5V9h2v2zm4 4H9v-2h2v2zm0-4H9V9h2v2zm0-4H9V5h2v2zm4 8h-2v-2h2v2zm0-4h-2V9h2v2zm0-4h-2V5h2v2zm4 12h-2v-2h2v2zm0-4h-2v-2h2v2z"/>
      </svg>
    </div>
    <div class="ibuild-bar" aria-hidden="true"><i></i></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('ibuild-boot');
      if (!el) return;
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 260);
    });
  </script>
</body>
</html>
