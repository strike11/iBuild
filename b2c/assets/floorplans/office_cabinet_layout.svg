<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <!-- Cabinet layout office: individual enclosed offices along a central corridor -->
  <rect x="20" y="20" width="200" height="140" fill="#F4F2E8" stroke="#2B2E33" stroke-width="4"/>
  <!-- corridor lines -->
  <line x1="20" y1="80" x2="220" y2="80" stroke="#2B2E33" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="20" y1="100" x2="220" y2="100" stroke="#2B2E33" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- top row of cabinets -->
  <g stroke="#2B2E33" stroke-width="2" fill="none">
    <line x1="66" y1="20" x2="66" y2="80"/>
    <line x1="112" y1="20" x2="112" y2="80"/>
    <line x1="158" y1="20" x2="158" y2="80"/>
  </g>
  <!-- bottom row of cabinets -->
  <g stroke="#2B2E33" stroke-width="2" fill="none">
    <line x1="66" y1="100" x2="66" y2="160"/>
    <line x1="112" y1="100" x2="112" y2="160"/>
    <line x1="158" y1="100" x2="158" y2="160"/>
  </g>
  <!-- desks inside a few cabinets -->
  <rect x="30" y="34" width="24" height="12" fill="none" stroke="#2B2E33" stroke-width="1.2"/>
  <rect x="76" y="34" width="24" height="12" fill="none" stroke="#2B2E33" stroke-width="1.2"/>
  <rect x="30" y="114" width="24" height="12" fill="none" stroke="#2B2E33" stroke-width="1.2"/>
  <!-- entrance door + swing -->
  <line x1="96" y1="160" x2="112" y2="160" stroke="#F4F2E8" stroke-width="4"/>
  <path d="M96,160 A16,16 0 0 1 112,144" fill="none" stroke="#DCEE5B" stroke-width="2"/>
  <line x1="96" y1="160" x2="112" y2="144" stroke="#DCEE5B" stroke-width="2"/>
  <text x="26" y="30" font-family="Arial, sans-serif" font-size="7" fill="#2B2E33">Office 1</text>
  <text x="72" y="30" font-family="Arial, sans-serif" font-size="7" fill="#2B2E33">Office 2</text>
  <text x="120" y="94" font-family="Arial, sans-serif" font-size="7" fill="#2B2E33">Corridor</text>
</svg>
