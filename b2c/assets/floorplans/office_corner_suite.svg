<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <!-- Corner suite office: large corner room with two glazed outer walls -->
  <rect x="20" y="20" width="200" height="140" fill="#F4F2E8" stroke="#2B2E33" stroke-width="4"/>
  <!-- thick accent lines marking floor-to-ceiling glazing on the two corner walls -->
  <line x1="20" y1="20" x2="140" y2="20" stroke="#DCEE5B" stroke-width="5"/>
  <line x1="220" y1="20" x2="220" y2="120" stroke="#DCEE5B" stroke-width="5"/>
  <!-- partition separating the corner suite from reception/support area -->
  <line x1="140" y1="20" x2="140" y2="110" stroke="#2B2E33" stroke-width="3"/>
  <line x1="20" y1="110" x2="140" y2="110" stroke="#2B2E33" stroke-width="3"/>
  <!-- executive desk in the corner suite -->
  <rect x="164" y="40" width="40" height="18" fill="none" stroke="#2B2E33" stroke-width="1.5"/>
  <!-- small meeting table -->
  <circle cx="184" cy="90" r="14" fill="none" stroke="#2B2E33" stroke-width="1.5"/>
  <!-- reception desk -->
  <rect x="34" y="120" width="46" height="14" fill="none" stroke="#2B2E33" stroke-width="1.5"/>
  <!-- entrance door + swing -->
  <line x1="96" y1="160" x2="120" y2="160" stroke="#F4F2E8" stroke-width="4"/>
  <path d="M96,160 A24,24 0 0 1 120,136" fill="none" stroke="#DCEE5B" stroke-width="2"/>
  <line x1="96" y1="160" x2="120" y2="136" stroke="#DCEE5B" stroke-width="2"/>
  <text x="150" y="34" font-family="Arial, sans-serif" font-size="8" fill="#2B2E33">Corner suite</text>
  <text x="36" y="116" font-family="Arial, sans-serif" font-size="8" fill="#2B2E33">Reception</text>
</svg>
