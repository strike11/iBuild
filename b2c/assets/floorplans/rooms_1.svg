<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <!-- 1-room / studio apartment: single living/sleeping area + bath nook -->
  <rect x="20" y="20" width="200" height="140" fill="#F4F2E8" stroke="#2B2E33" stroke-width="4"/>
  <!-- bathroom partition, top-right corner -->
  <line x1="168" y1="20" x2="168" y2="66" stroke="#2B2E33" stroke-width="3"/>
  <line x1="168" y1="66" x2="220" y2="66" stroke="#2B2E33" stroke-width="3"/>
  <!-- bed icon -->
  <rect x="38" y="36" width="52" height="72" fill="none" stroke="#2B2E33" stroke-width="1.5"/>
  <line x1="38" y1="56" x2="90" y2="56" stroke="#2B2E33" stroke-width="1.5"/>
  <!-- kitchenette counter -->
  <rect x="132" y="132" width="70" height="14" fill="none" stroke="#2B2E33" stroke-width="1.5"/>
  <!-- entrance door + swing -->
  <line x1="96" y1="160" x2="120" y2="160" stroke="#F4F2E8" stroke-width="4"/>
  <path d="M96,160 A24,24 0 0 1 120,136" fill="none" stroke="#DCEE5B" stroke-width="2"/>
  <line x1="96" y1="160" x2="120" y2="136" stroke="#DCEE5B" stroke-width="2"/>
  <text x="46" y="128" font-family="Arial, sans-serif" font-size="11" fill="#2B2E33">Studio</text>
  <text x="176" y="46" font-family="Arial, sans-serif" font-size="9" fill="#2B2E33">Bath</text>
  <text x="140" y="128" font-family="Arial, sans-serif" font-size="9" fill="#2B2E33">Kitchen</text>
</svg>
