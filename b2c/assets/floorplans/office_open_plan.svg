<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <!-- Open-plan office: one large floor, desk clusters, glass meeting room -->
  <rect x="20" y="20" width="200" height="140" fill="#F4F2E8" stroke="#2B2E33" stroke-width="4"/>
  <!-- reception desk near entrance -->
  <rect x="34" y="130" width="46" height="14" fill="none" stroke="#2B2E33" stroke-width="1.5"/>
  <!-- desk clusters (rows of small rectangles) -->
  <g stroke="#2B2E33" stroke-width="1.2" fill="none">
    <rect x="40" y="36" width="18" height="12"/>
    <rect x="62" y="36" width="18" height="12"/>
    <rect x="40" y="54" width="18" height="12"/>
    <rect x="62" y="54" width="18" height="12"/>
    <rect x="94" y="36" width="18" height="12"/>
    <rect x="116" y="36" width="18" height="12"/>
    <rect x="94" y="54" width="18" height="12"/>
    <rect x="116" y="54" width="18" height="12"/>
  </g>
  <!-- glass-partition meeting room, dashed to signal glazing -->
  <rect x="150" y="30" width="60" height="50" fill="none" stroke="#DCEE5B" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- entrance door + swing -->
  <line x1="96" y1="160" x2="120" y2="160" stroke="#F4F2E8" stroke-width="4"/>
  <path d="M96,160 A24,24 0 0 1 120,136" fill="none" stroke="#DCEE5B" stroke-width="2"/>
  <line x1="96" y1="160" x2="120" y2="136" stroke="#DCEE5B" stroke-width="2"/>
  <text x="36" y="126" font-family="Arial, sans-serif" font-size="8" fill="#2B2E33">Reception</text>
  <text x="42" y="102" font-family="Arial, sans-serif" font-size="8" fill="#2B2E33">Desk area</text>
  <text x="158" y="92" font-family="Arial, sans-serif" font-size="8" fill="#2B2E33">Meeting</text>
</svg>
