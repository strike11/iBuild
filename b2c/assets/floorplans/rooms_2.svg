<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <!-- 2-room apartment: bedroom + living/kitchen, bath -->
  <rect x="20" y="20" width="200" height="140" fill="#F4F2E8" stroke="#2B2E33" stroke-width="4"/>
  <!-- bedroom partition -->
  <line x1="110" y1="20" x2="110" y2="100" stroke="#2B2E33" stroke-width="3"/>
  <line x1="20" y1="100" x2="110" y2="100" stroke="#2B2E33" stroke-width="3"/>
  <!-- bathroom nook -->
  <line x1="110" y1="100" x2="150" y2="100" stroke="#2B2E33" stroke-width="3"/>
  <line x1="150" y1="100" x2="150" y2="160" stroke="#2B2E33" stroke-width="3"/>
  <!-- bed icon -->
  <rect x="34" y="34" width="48" height="60" fill="none" stroke="#2B2E33" stroke-width="1.5"/>
  <line x1="34" y1="52" x2="82" y2="52" stroke="#2B2E33" stroke-width="1.5"/>
  <!-- sofa icon in living -->
  <rect x="126" y="120" width="60" height="16" fill="none" stroke="#2B2E33" stroke-width="1.5"/>
  <!-- kitchen counter -->
  <rect x="164" y="34" width="14" height="56" fill="none" stroke="#2B2E33" stroke-width="1.5"/>
  <!-- entrance door + swing -->
  <line x1="182" y1="160" x2="206" y2="160" stroke="#F4F2E8" stroke-width="4"/>
  <path d="M182,160 A24,24 0 0 1 206,136" fill="none" stroke="#DCEE5B" stroke-width="2"/>
  <line x1="182" y1="160" x2="206" y2="136" stroke="#DCEE5B" stroke-width="2"/>
  <text x="42" y="30" font-family="Arial, sans-serif" font-size="9" fill="#2B2E33">Bedroom</text>
  <text x="130" y="112" font-family="Arial, sans-serif" font-size="9" fill="#2B2E33">Living</text>
  <text x="118" y="150" font-family="Arial, sans-serif" font-size="8" fill="#2B2E33">Bath</text>
</svg>
