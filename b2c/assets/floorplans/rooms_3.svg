<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <!-- 3-room apartment: 2 bedrooms + living/kitchen, bath -->
  <rect x="20" y="20" width="200" height="140" fill="#F4F2E8" stroke="#2B2E33" stroke-width="4"/>
  <!-- vertical split separating bedrooms wing from living wing -->
  <line x1="96" y1="20" x2="96" y2="160" stroke="#2B2E33" stroke-width="3"/>
  <!-- split bedrooms wing horizontally -->
  <line x1="20" y1="90" x2="96" y2="90" stroke="#2B2E33" stroke-width="3"/>
  <!-- bathroom nook in living wing -->
  <line x1="96" y1="120" x2="132" y2="120" stroke="#2B2E33" stroke-width="3"/>
  <line x1="132" y1="120" x2="132" y2="160" stroke="#2B2E33" stroke-width="3"/>
  <!-- bed icons -->
  <rect x="32" y="32" width="46" height="46" fill="none" stroke="#2B2E33" stroke-width="1.5"/>
  <line x1="32" y1="46" x2="78" y2="46" stroke="#2B2E33" stroke-width="1.5"/>
  <rect x="32" y="102" width="46" height="46" fill="none" stroke="#2B2E33" stroke-width="1.5"/>
  <line x1="32" y1="116" x2="78" y2="116" stroke="#2B2E33" stroke-width="1.5"/>
  <!-- sofa + kitchen counter -->
  <rect x="146" y="34" width="60" height="16" fill="none" stroke="#2B2E33" stroke-width="1.5"/>
  <rect x="190" y="70" width="14" height="70" fill="none" stroke="#2B2E33" stroke-width="1.5"/>
  <!-- entrance door + swing -->
  <line x1="150" y1="160" x2="174" y2="160" stroke="#F4F2E8" stroke-width="4"/>
  <path d="M150,160 A24,24 0 0 1 174,136" fill="none" stroke="#DCEE5B" stroke-width="2"/>
  <line x1="150" y1="160" x2="174" y2="136" stroke="#DCEE5B" stroke-width="2"/>
  <text x="30" y="26" font-family="Arial, sans-serif" font-size="8" fill="#2B2E33">Bedroom</text>
  <text x="30" y="96" font-family="Arial, sans-serif" font-size="8" fill="#2B2E33">Bedroom</text>
  <text x="148" y="30" font-family="Arial, sans-serif" font-size="9" fill="#2B2E33">Living</text>
  <text x="98" y="150" font-family="Arial, sans-serif" font-size="8" fill="#2B2E33">Bath</text>
</svg>
